name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match manifest version
        run: |
          v=$(python3 -c "import json;print(json.load(open('custom_components/ring_plus/manifest.json'))['version'])")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != manifest v$v"; exit 1; }
      - run: ./scripts/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/ring_plus.zip
          generate_release_notes: true
